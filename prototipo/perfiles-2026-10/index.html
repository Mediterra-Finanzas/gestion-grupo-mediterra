<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mediterra · Inicio por perfil (prototipo)</title>
<style>
:root{
  --bg:#f4f5f7; --surface:#fff; --surface-2:#f0f2f5; --border:#d6dae1; --border-strong:#7a8496;
  --text:#14181f; --text-2:#3d4554; --muted:#566070; --brand:#1e2a5a; --brand-soft:#e6e9f4;
  --red:#b42318; --red-soft:#fdecea; --amber:#8a5300; --amber-soft:#fff4e0; --green:#146c43; --green-soft:#e5f4ec;
  --focus:#1d4ed8; --radius:10px; --fs:15px; --fs-sm:13px;
  --c0w:clamp(132px, 34vw, 280px);   /* ancho ÚNICO de la columna de conceptos: la usan th, td y el rótulo de grupo */
  --tap:44px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1218; --surface:#171b23; --surface-2:#1f2430; --border:#323a49; --border-strong:#6b7790;
  --text:#eef1f6; --text-2:#c9cfda; --muted:#a3acbb; --brand:#aab8f0; --brand-soft:#252c47;
  --red:#ff8a80; --red-soft:#3a1d1b; --amber:#ffc266; --amber-soft:#3a2b10; --green:#7fd6a6; --green-soft:#173326; --focus:#8fb0ff; } }
:root[data-theme="dark"]{
  --bg:#0f1218; --surface:#171b23; --surface-2:#1f2430; --border:#323a49; --border-strong:#6b7790;
  --text:#eef1f6; --text-2:#c9cfda; --muted:#a3acbb; --brand:#aab8f0; --brand-soft:#252c47;
  --red:#ff8a80; --red-soft:#3a1d1b; --amber:#ffc266; --amber-soft:#3a2b10; --green:#7fd6a6; --green-soft:#173326; --focus:#8fb0ff; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:var(--fs)/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.skip{position:absolute;left:-999px;top:0;z-index:100;background:var(--surface);padding:10px 14px}
.skip:focus{left:8px;top:8px}
button,select,input{font:inherit;color:inherit}
.btn{min-height:var(--tap);min-width:var(--tap);padding:0 16px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.btn.peligro{border-color:var(--red);color:var(--red)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
@media (pointer:fine){ :root{--tap:36px} }   /* con mouse/trackpad: 36px (≥ 24 de WCAG 2.5.8) */
.ficticio{background:#7c2d12;color:#fff;font-size:var(--fs-sm);font-weight:600;padding:6px 16px;text-align:center}
.top{position:sticky;top:0;z-index:40;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.top .marca{font-weight:700;color:var(--brand);margin-right:auto}
.top label{font-size:var(--fs-sm);color:var(--muted);display:flex;align-items:center;gap:6px}
.top select{min-height:var(--tap);border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);padding:0 8px;max-width:58vw}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden}
.seg button{min-height:var(--tap);min-width:var(--tap);padding:0 12px;border:0;background:var(--surface);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--surface)}
.shell{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 90px)}
.nav{background:var(--surface);border-right:1px solid var(--border);padding:12px 8px}
.nav a{display:flex;align-items:center;gap:10px;min-height:var(--tap);padding:0 12px;border-radius:8px;color:var(--text);text-decoration:none}
.nav a[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav .ico{width:22px;text-align:center;flex:none}
.nav .badge{margin-left:auto}
.nav h2{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:16px 12px 4px}
.badge{display:inline-block;min-width:22px;padding:1px 7px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;font-weight:700;text-align:center}
.badge.n{background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
main{padding:20px 24px 96px;min-width:0}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--muted);font-size:var(--fs-sm);margin-bottom:16px}
.aviso{border:1px solid var(--border-strong);border-left:4px solid var(--amber);background:var(--amber-soft);border-radius:var(--radius);padding:10px 14px;font-size:var(--fs-sm);margin:0 0 16px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card h2{font-size:16px;margin:0 0 10px}
.cues{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.cue{display:block;text-decoration:none;color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:12px;background:var(--surface);min-height:88px}
.cue .n{font-size:28px;font-weight:700;line-height:1.1}
.cue .l{font-size:var(--fs-sm);color:var(--text-2)}
.cue.alta{border-left:4px solid var(--red)} .cue.media{border-left:4px solid var(--amber)} .cue.ok{border-left:4px solid var(--green)}
.acciones{display:flex;flex-wrap:wrap;gap:8px}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{border:1px solid var(--border);border-radius:var(--radius);padding:12px;background:var(--surface)}
.kpi .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--border-strong);color:var(--text-2);background:var(--surface-2)}
.tag.alta{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.tag.media{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
.tag.ok{border-color:var(--green);color:var(--green);background:var(--green-soft)}
/* Bandeja */
.bandeja{display:grid;grid-template-columns:minmax(320px,420px) 1fr;gap:16px;align-items:start}
.lista{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.lista li+li{border-top:1px solid var(--border)}
.lista button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;width:100%;padding:12px 14px;cursor:pointer;min-height:64px}
.lista button:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
.lista button[aria-current="true"]{background:var(--brand-soft)}
.lista .t{font-weight:600}
.lista .m{grid-column:2/4;font-size:var(--fs-sm);color:var(--muted)}
.filtros{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{min-height:var(--tap);padding:0 14px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--surface);border-color:var(--brand)}
.detalle{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;position:sticky;top:110px}
.detalle dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0 0 12px}
.detalle dt{color:var(--muted);font-size:var(--fs-sm)} .detalle dd{margin:0}
.barra-acc{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.lineas{width:100%;border-collapse:collapse;font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
.lineas th,.lineas td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:left}
.lineas td.num,.lineas th.num{text-align:right}
/* Tabla de flujo — sin solapamiento */
.tabla-wrap{overflow:auto;max-height:70vh;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);
  scroll-snap-type:x mandatory; scroll-padding-left:var(--c0w); overscroll-behavior-x:contain}
.ft{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;font-size:14px}
.ft th,.ft td{padding:0 10px;height:34px;white-space:nowrap;border-bottom:1px solid var(--border);background:var(--surface)}
.ft td.num,.ft th.num{text-align:right;min-width:var(--colw,104px);width:var(--colw,104px);max-width:var(--colw,104px)}
.ft .tot{min-width:var(--colw,112px);width:var(--colw,112px);max-width:var(--colw,112px)}
.ft th .rt{display:block;font-size:12px;font-weight:400;color:var(--muted);line-height:1}
.ft thead th{height:44px}
.ft thead th{position:sticky;top:0;z-index:3;background:var(--surface-2);font-weight:600}
.ft thead th.mes{scroll-snap-align:start}
.ft .c0{position:sticky;left:0;z-index:2;width:var(--c0w);min-width:var(--c0w);max-width:var(--c0w);overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--border-strong);text-align:left}
.ft thead .c0{z-index:4}
.ft tr.grupo td{background:var(--surface-2);font-weight:600}
.ft tr.grupo td.c0{background:var(--surface-2)}
.ft tr.neto td{font-weight:700;border-top:2px solid var(--text)}
.ft .tot{border-left:1px solid var(--border-strong);font-weight:600}
@media (min-width:1024px){ .ft .tot{position:sticky;right:0;z-index:2} .ft thead .tot{z-index:4} }
.ft .real{color:var(--muted)}
.ft td.neg{color:var(--red)}
/* Vista mes a mes (teléfono) */
.mesnav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.mesnav strong{flex:1;text-align:center;font-size:17px}
.filas-mes{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.filas-mes li{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--border);font-variant-numeric:tabular-nums}
.filas-mes li:first-child{border-top:0}
.filas-mes li.g{background:var(--surface-2);font-weight:600}
.filas-mes li.n{font-weight:700;border-top:2px solid var(--text)}
.filas-mes .c{min-width:0;overflow-wrap:anywhere}
.subir{border:2px dashed var(--border-strong);border-radius:var(--radius);padding:18px;text-align:center;background:var(--surface-2)}
.subir input{position:absolute;opacity:0;width:1px;height:1px}
.subir label{display:inline-flex}
.bottom{display:none}
.solo-movil{display:none}
/* ── Tablet (600–1023): riel ── */
@media (max-width:1023px){
  .shell{grid-template-columns:88px 1fr}
  .nav{padding:8px 4px}
  .nav h2{display:none}
  .nav a{flex-direction:column;justify-content:center;gap:2px;padding:6px 2px;font-size:12px;text-align:center;min-height:64px;position:relative}
  .nav a .ico{font-size:20px}
  .nav a .badge{position:absolute;top:4px;right:10px;margin:0}
  .nav a .txt{max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bandeja{grid-template-columns:1fr}
  .bandeja.con-detalle .lista-col{display:none}
  .detalle{position:static}
  .solo-movil{display:inline-flex}
}
/* Tablet horizontal ancha: lista + detalle lado a lado */
@media (min-width:900px) and (max-width:1023px) and (orientation:landscape){
  .bandeja{grid-template-columns:minmax(300px,380px) 1fr}
  .bandeja.con-detalle .lista-col{display:block}
  .bandeja .solo-movil{display:none}
}
/* ── Teléfono (<600): barra inferior ── */
@media (max-width:599px){
  :root{--fs:16px}
  .shell{display:block}
  .nav{display:none}
  main{padding:14px 16px calc(96px + env(safe-area-inset-bottom))}
  h1{font-size:21px}
  .top{padding:6px 12px}
  .top .lbl-txt{display:none}
  .top{flex-wrap:nowrap}
  .top .marca{font-size:14px}
  .top select{max-width:46vw;font-size:14px}
  .ficticio{font-size:12px;padding:4px 10px}
  .ficticio .largo{display:none}
  .bottom{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
  .bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60px;font-size:12px;color:var(--text-2);text-decoration:none;position:relative}
  .bottom a[aria-current="page"]{color:var(--brand);font-weight:700}
  .bottom .ico{font-size:20px}
  .bottom .badge{position:absolute;top:4px;left:calc(50% + 6px)}
  .detalle .barra-acc{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom));background:var(--surface);padding:10px 0;margin:12px -16px -16px;padding-inline:16px;border-top:1px solid var(--border)}
  .barra-acc .btn{flex:1}
  .grid{grid-template-columns:1fr}
  .ft .c0{white-space:normal;line-height:1.2;padding-block:6px;text-overflow:clip}
  .ft td{height:auto;min-height:44px}
}
/* Teléfono horizontal (bajo): la barra inferior pasa a riel para no comer alto */
@media (max-height:500px) and (orientation:landscape) and (max-width:1023px){
  .shell{display:grid;grid-template-columns:88px 1fr}
  .nav{display:block}
  .bottom{display:none}
  main{padding-bottom:24px}
  .detalle .barra-acc{position:static;margin:12px 0 0;padding:0;border:0}
}
</style>
</head>

const MOD = {

};
function destinos(p){
  const m = p.modulos, d = [];
  const tiene = (k) => m.includes(k) || m.some(x => x.startsWith(k + ":"));
  const fin = (t) => m.includes("finanzas") || m.includes("finanzas:" + t);
  if (tiene("tareas")) d.push("tareas");
  if (m.includes("finanzas")) d.push("flujo", "bancos", "creditos", "nominas");
  if (fin("reporte") && !m.includes("finanzas")) d.push("reporte");
  if (tiene("contabilidad")) d.push("contabilidad");
  if (tiene("osiris")) d.push("osiris");
  if (tiene("frisku")) d.push("frisku");
  if (tiene("allegria")) d.push("allegria");
  if (fin("rendiciones")) d.push("rendiciones");
  return d;
}

/* Cabe un número ENTERO de meses entre la columna fija y el total fijo: con el ajuste a borde
   (scroll-snap) ninguna cifra queda cortada a la izquierda ni a la derecha. */
function ajustarColumnas(){
  const w = document.querySelector(".tabla-wrap"); if (!w) return;
  const t = w.querySelector(".ft"), c0 = t.querySelector("thead .c0"), tot = t.querySelector("thead .tot");
  // Todas las columnas desplazables (meses y, si no es fija, la del total) miden lo mismo: así
  // el final del desplazamiento también cae en un borde de columna.
  const sticky = getComputedStyle(tot).position === "sticky";
  const cw = c0.getBoundingClientRect().width;
  let min = 104;
  for (let k = 0; k < 3; k++) {
    const disp = w.clientWidth - cw;
    // con total fijo, n meses + total = disp ⇒ colw = disp / (n + 1); sin total fijo, disp / n
    const n = Math.max(1, Math.floor(disp / min) - (sticky ? 1 : 0));
    const colw = disp / (n + (sticky ? 1 : 0));
    t.style.setProperty("--colw", colw + "px");
    const real = t.querySelector("thead th.mes").getBoundingClientRect().width;
    if (real <= colw + 0.5) break;
    min = real;                          // el contenido pide más ancho: recalcular
  }
}
document.addEventListener("keydown", (e) => {
  const w = e.target.closest && e.target.closest(".tabla-wrap"); if (!w) return;
  const colw = w.querySelector("thead th.mes").getBoundingClientRect().width;
  const paso = { ArrowRight: colw, ArrowLeft: -colw, End: 1e6, Home: -1e6 }[e.key];
  if (paso === undefined) return;
  e.preventDefault(); w.scrollBy({ left: paso });
});
addEventListener("resize", ajustarColumnas);
function enlazar(){
  ajustarColumnas();
  document.querySelectorAll("[data-abrir]").forEach(b => b.onclick = () => { location.hash = ruta("bandeja", b.dataset.abrir); });

  document.querySelectorAll("[data-mes]").forEach(b => b.onclick = () => { est.mes = Math.max(0, Math.min(MESES.length - 1, est.mes + Number(b.dataset.mes))); render(); });
  document.querySelectorAll("[data-tabla]").forEach(b => b.onclick = () => { est.tabla = b.dataset.tabla === "1"; render(); });
  document.querySelectorAll("[data-accion]").forEach(b => b.onclick = () => { document.getElementById("eco").textContent = `Prototipo: "${b.dataset.accion}" no guarda nada.`; });
}
document.getElementById("persona").innerHTML = Object.entries(PERSONAS).map(([k, p]) => `<option value="${k}">${esc(p.nombre)} — ${esc(p.cargo)}</option>`).join("");
document.getElementById("persona").onchange = (e) => { est.persona = e.target.value; location.hash = ruta(est.alt === "B" ? "bandeja" : "inicio"); };
document.querySelectorAll("[data-alt]").forEach(b => b.onclick = () => { est.alt = b.dataset.alt; location.hash = ruta(est.alt === "B" ? "bandeja" : "inicio"); });
addEventListener("keydown", (e) => { if (e.key === "Escape" && est.sel) location.hash = ruta("bandeja"); });
addEventListener("hashchange", () => { const prev = est.sel; leerHash(); render(); if (est.sel) { const h = document.getElementById("det-h"); h && h.setAttribute("tabindex", "-1"); h && h.focus(); } else if (prev) { const b = document.querySelector(`[data-abrir="${prev}"]`); b && b.focus(); } });
matchMedia("(max-width:599px)").addEventListener("change", render);
leerHash(); render();
</script>
</body>
</html>
